<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#techGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Shield shape for security -->
  <path d="M50 15 L35 25 L35 45 Q35 60 50 75 Q65 60 65 45 L65 25 Z" fill="#ffffff" opacity="0.9"/>
  
  <!-- Lock icon inside shield -->
  <rect x="45" y="35" width="10" height="12" rx="2" fill="url(#techGradient)" stroke="none"/>
  <circle cx="50" cy="30" r="4" fill="none" stroke="url(#techGradient)" stroke-width="2"/>
  
  <!-- Tech circuit lines -->
  <path d="M20 50 L30 50 M70 50 L80 50 M50 20 L50 30 M50 70 L50 80" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <circle cx="30" cy="50" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="70" cy="50" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="50" cy="20" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="50" cy="80" r="2" fill="#ffffff" opacity="0.7"/>
</svg>